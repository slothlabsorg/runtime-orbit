name: release

# Tag a version to cut a release:  git tag v0.2.0 && git push --tags
on:
  push:
    tags:
      - "v*"
  # Lets you re-run the whole thing against an existing tag from the UI.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  # The upload action attaches assets to an *existing* release, so create it
  # first. Five matrix jobs racing to create it themselves is how you get
  # "release not found" on all of them.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Create the release if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --title "runtime-orbit ${TAG#v}" \
            --generate-notes \
            --verify-tag

  # Cross-compile the `runtime-orbit` binary for every supported platform and
  # attach a per-target archive (+ sha256) to the GitHub Release for this tag.
  binaries:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,        os: macos-latest }
          - { target: x86_64-apple-darwin,         os: macos-latest }
          - { target: x86_64-unknown-linux-gnu,    os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu,   os: ubuntu-latest }
          # No native Windows target. The transport is a forwarded *unix* socket,
          # and bollard's unix connector is unix-only — a Windows binary would
          # not compile, let alone work. Windows machines lend their runtime from
          # inside a WSL2 distro, using the linux binary. A native Windows
          # borrower needs the TCP-forward path; see the roadmap.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Builds for the target (using `cross` when needed, e.g. linux-aarch64),
      # archives as runtime-orbit-<target>.{tar.gz,zip}, writes a .sha256, and
      # uploads to the release for this tag (creating it if missing).
      - name: Build & upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: runtime-orbit
          target: ${{ matrix.target }}
          archive: runtime-orbit-$target
          checksum: sha256
          # Required for workflow_dispatch: the action refuses to run unless the
          # ref is a tag, and on a manual re-run github.ref is refs/heads/main.
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Ship the installers as release assets too, so the website can link to a
  # stable URL that doesn't depend on the default branch.
  installers:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Attach install script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/install.sh --clobber

  # Bump the Homebrew formula in slothlabsorg/homebrew-tap after the binaries
  # are published. Requires a HOMEBREW_TAP_TOKEN secret (fine-grained PAT with
  # Contents:Write on the tap repo) — same pattern as the other Orbit tools.
  # Skipped automatically if the secret isn't set.
  homebrew:
    needs: binaries
    runs-on: ubuntu-latest
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}   # skip prereleases (v1.0.0-rc1)
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Bump tap formula
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          fetch_sha() { curl -fsSL "$BASE/$1.sha256" | awk '{print $1}'; }
          SHA_ARM_MAC=$(fetch_sha runtime-orbit-aarch64-apple-darwin.tar.gz)
          SHA_X86_MAC=$(fetch_sha runtime-orbit-x86_64-apple-darwin.tar.gz)
          SHA_X86_LNX=$(fetch_sha runtime-orbit-x86_64-unknown-linux-gnu.tar.gz)
          SHA_ARM_LNX=$(fetch_sha runtime-orbit-aarch64-unknown-linux-gnu.tar.gz)

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/slothlabsorg/homebrew-tap.git" tap
          cd tap
          mkdir -p Formula
          cat > Formula/runtime-orbit.rb <<EOF
          class RuntimeOrbit < Formula
            desc "Borrow a beefier machine's container runtime over your LAN, transparently"
            homepage "https://slothlabs.org/runtime-orbit"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/runtime-orbit-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM_MAC}"
              end
              on_intel do
                url "${BASE}/runtime-orbit-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_MAC}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/runtime-orbit-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_ARM_LNX}"
              end
              on_intel do
                url "${BASE}/runtime-orbit-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_X86_LNX}"
              end
            end

            def install
              bin.install "runtime-orbit"
              bin.install_symlink bin/"runtime-orbit" => "r-orbit"
              bin.install_symlink bin/"runtime-orbit" => "orbit"
            end

            test do
              assert_match "runtime-orbit", shell_output("#{bin}/runtime-orbit --version")
            end
          end
          EOF

          # The pre-0.2 formula would keep shadowing the `orbit` symlink we now
          # install, so retire it in the same commit as the rename.
          rm -f Formula/container-orbit.rb

          git config user.name "slothlabs-ci"
          git config user.email "ci@slothlabs.org"
          git add -A Formula
          git commit -m "runtime-orbit ${VERSION}" || echo "no changes"
          git push

# ── Signed native installers (.pkg / .exe) ──────────────────────────────────
# These need signing certificates and are intentionally a follow-up:
#   • macOS .pkg  → `pkgbuild --identifier org.slothlabs.runtime-orbit \
#       --install-location /usr/local/bin --root <dir-with-binary> runtime-orbit.pkg`,
#       then `productsign`/`notarytool` with a Developer ID cert
#       (secrets: MACOS_CERT_P12, MACOS_CERT_PASSWORD, AC_API_KEY…).
# Until that cert exists, brew + install.sh are the frictionless install paths
# and need no signing.
